<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <defs>
    <linearGradient id="mandalaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#FF9933" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#C62828" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <g stroke="url(#mandalaGold)" stroke-width="1.2" transform="translate(250, 250)">
    <!-- Concentric Circles -->
    <circle r="20" stroke-width="2"/>
    <circle r="40" stroke-dasharray="3 3"/>
    <circle r="70" stroke-width="1.5"/>
    <circle r="110" stroke-dasharray="4 4"/>
    <circle r="150" stroke-width="1.8"/>
    <circle r="190" stroke-dasharray="6 3"/>
    <circle r="230" stroke-width="2"/>
    
    <!-- 8 Primary Petals -->
    <g id="petal-group">
      <path d="M0 -70 C25 -100 25 -130 0 -150 C-25 -130 -25 -100 0 -70 Z" fill="#FF9933" fill-opacity="0.06"/>
      <path d="M0 -150 C35 -180 35 -210 0 -230 C-35 -210 -35 -180 0 -150 Z" fill="#D4AF37" fill-opacity="0.04"/>
      <circle cx="0" cy="-110" r="4" fill="#D4AF37" fill-opacity="0.7"/>
      <circle cx="0" cy="-190" r="5" fill="#FF9933" fill-opacity="0.7"/>
      <line x1="0" y1="-20" x2="0" y2="-70"/>
    </g>
    <use href="#petal-group" transform="rotate(45)"/>
    <use href="#petal-group" transform="rotate(90)"/>
    <use href="#petal-group" transform="rotate(135)"/>
    <use href="#petal-group" transform="rotate(180)"/>
    <use href="#petal-group" transform="rotate(225)"/>
    <use href="#petal-group" transform="rotate(270)"/>
    <use href="#petal-group" transform="rotate(315)"/>
    
    <!-- 16 Sub Rays -->
    <g id="ray">
      <line x1="0" y1="-40" x2="0" y2="-65" stroke-width="0.8"/>
      <path d="M0 -70 L5 -85 L0 -90 L-5 -85 Z" fill="#D4AF37" fill-opacity="0.3"/>
    </g>
    <use href="#ray" transform="rotate(22.5)"/>
    <use href="#ray" transform="rotate(67.5)"/>
    <use href="#ray" transform="rotate(112.5)"/>
    <use href="#ray" transform="rotate(157.5)"/>
    <use href="#ray" transform="rotate(202.5)"/>
    <use href="#ray" transform="rotate(247.5)"/>
    <use href="#ray" transform="rotate(292.5)"/>
    <use href="#ray" transform="rotate(337.5)"/>
    
    <!-- Center Om Accent -->
    <circle r="8" fill="#FFD700" fill-opacity="0.8"/>
  </g>
</svg>
