<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="chartGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>
  </defs>
  <!-- Outer Square -->
  <rect x="6" y="6" width="88" height="88" stroke="url(#chartGold)" stroke-width="2.5" fill="#201108" fill-opacity="0.4"/>
  <!-- Corner to Corner Diagonals (X) -->
  <line x1="6" y1="6" x2="94" y2="94" stroke="url(#chartGold)" stroke-width="1.8"/>
  <line x1="94" y1="6" x2="6" y2="94" stroke="url(#chartGold)" stroke-width="1.8"/>
  <!-- Inner Diamond connecting midpoints -->
  <polygon points="50,6 94,50 50,94 6,50" stroke="url(#chartGold)" stroke-width="2.2" fill="#3D1C06" fill-opacity="0.25"/>
  <!-- Central 1st House (Lagna / Ascendant) marker -->
  <circle cx="50" cy="35" r="4.5" fill="#FFD700" opacity="0.8"/>
  <text x="50" y="38" fill="#1A0D00" font-family="'Cinzel Decorative', serif" font-size="5" font-weight="bold" text-anchor="middle">1</text>
  <!-- Auspicious glow dots at intersections -->
  <circle cx="50" cy="50" r="2.5" fill="#FF9933"/>
  <circle cx="50" cy="6" r="2" fill="#FFD700"/>
  <circle cx="94" cy="50" r="2" fill="#FFD700"/>
  <circle cx="50" cy="94" r="2" fill="#FFD700"/>
  <circle cx="6" cy="50" r="2" fill="#FFD700"/>
</svg>
